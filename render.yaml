databases:
  - name: text2book-db
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: text2book-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: text2book-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_CLIENT
        value: "gpt-4.1-nano"
      - key: OPENAI_MODEL_OWNER
        value: "gpt-4.1-mini"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: TRIAL_DAYS
        value: "7"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: text2book-reminders-cron
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: node -e "fetch(process.env.APP_URL + '/api/cron/reminders', { method: 'POST', headers: { 'Authorization': 'Bearer ' + process.env.CRON_SECRET } }).then(r => r.json()).then(console.log).catch(console.error)"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: text2book-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: text2book-calendar-sync-cron
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 * * * *"
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: node -e "fetch(process.env.APP_URL + '/api/cron/calendar-sync', { method: 'POST', headers: { 'Authorization': 'Bearer ' + process.env.CRON_SECRET } }).then(r => r.json()).then(console.log).catch(console.error)"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: text2book-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
